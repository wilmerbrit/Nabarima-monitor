; Compilar y cargar con PlatformIO (VS Code): un entorno por placa.
;   pio run -e nodo1 -t upload      (nodo1 … nodo4, maestro)
;   pio device monitor              (ver lo que envía, a 115200)
[platformio]
src_dir = planta
default_envs = maestro, nodo1, nodo2, nodo3, nodo4

[env]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.1.2
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@4.0.3

[env:maestro]
build_flags = -DNODO_ID=0

[env:nodo1]
build_flags = -DNODO_ID=1

[env:nodo2]
build_flags = -DNODO_ID=2

[env:nodo3]
build_flags = -DNODO_ID=3

[env:nodo4]
build_flags = -DNODO_ID=4
